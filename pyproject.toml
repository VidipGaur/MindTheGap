[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mind-the-gap-ubc-ocean"
version = "0.3.0"
description = "Research code for a controlled audit of pathology foundation models on ovarian carcinoma subtyping (UBC-OCEAN)."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Vidip Gaur" }, { name = "Vidu Gaur" }]
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
# Versions match requirements.txt, which records where each pin comes from.
dependencies = [
    "numpy==1.26.4",
    "scipy==1.17.1",
    "pandas==3.0.2",
    "scikit-learn==1.8.0",
    "scikit-image==0.26.0",
    "matplotlib==3.10.8",
    "Pillow==10.4.0",
    "opencv-python-headless==4.7.0.72",
    "tqdm",
    "torch==2.5.1",
]

[project.urls]
Repository = "https://github.com/VidipGaur/MindTheGap"
Issues = "https://github.com/VidipGaur/MindTheGap/issues"

[project.optional-dependencies]
wsi = [
    "openslide-python==1.4.3",
    "tiffslide==2.5.1",
    "pyvips==3.1.1",
    "tifffile==2025.5.10",
    "zarr==2.18.7",
]
fm = [
    "timm==1.0.29",
    "transformers==5.16.1",
    "huggingface_hub",
    "safetensors",
    "einops==0.8.2",
]
# The CUDA 12.1 wheels live on the PyTorch index, which an extra cannot name.
# Install with: pip install -e ".[gpu]" --extra-index-url https://download.pytorch.org/whl/cu121
gpu = [
    "torch==2.5.1",
    "torchvision==0.20.1",
]
dev = [
    "pytest",
    "ruff",
    "pre-commit",
    "pip-licenses",
]

[tool.setuptools]
# The scripts import each other by bare module name and live in four folders under
# scripts/, which a setuptools module list cannot express, so nothing is installed as
# a module. Run the scripts from a checkout.
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts/pipeline", "scripts/analysis", "scripts/verify", "scripts/dev", "."]
addopts = "-ra"

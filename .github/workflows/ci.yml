name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # CPU only, no secrets, no data. torch comes from PyPI (its Linux wheel is a
    # CUDA build, which runs on CPU), so no index beyond PyPI is needed.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Syntax errors and undefined names
        run: ruff check --select E9,F63,F7,F82 scripts tools tests smoke
      - name: Windows path audit
        run: python tools/audit_paths.py
      # scripts/ is scanned for credentials only: Windows paths in it are gated
      # by the path audit above, and the DEV-ONLY scripts that keep them are
      # never exported.
      - name: Secret scan
        run: |
          python tools/scan_secrets.py scripts
          python tools/scan_secrets.py --strict tools tests smoke docs .github \
            $(ls *.md *.txt *.toml *.cff 2>/dev/null)
      - name: Tests
        env:
          MPLBACKEND: Agg
        run: python -m pytest -q
